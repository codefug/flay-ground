name: "axios-testproxy-debug E2E"

on:
  push:
    branches: [main, "feat/axios-testproxy-debug"]
    paths:
      - "apps/axios-testproxy-debug/**"
      - ".github/workflows/axios-testproxy-debug.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main]
    paths:
      - "apps/axios-testproxy-debug/**"
      - ".github/workflows/axios-testproxy-debug.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      axios_version:
        description: "axios version to test (e.g. 1.15.0 or 1.16.0)"
        required: false
        default: "1.15.0"

env:
  API_URL: "http://mock-api.example.com"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/axios-testproxy-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Override axios version (if specified via workflow_dispatch)
        if: ${{ github.event.inputs.axios_version != '' && github.event_name == 'workflow_dispatch' }}
        env:
          AXIOS_VERSION: ${{ github.event.inputs.axios_version }}
        run: |
          echo "Setting axios to ${AXIOS_VERSION}"
          pnpm pkg set "dependencies.axios=${AXIOS_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build app
        run: pnpm build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Start server
        run: pnpm start &

      - name: Wait for server
        run: pnpm dlx wait-on --timeout 60000 http://localhost:3100

      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/axios-testproxy-debug/blob-report
          retention-days: 7
